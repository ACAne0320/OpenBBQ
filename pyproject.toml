[project]
name = "openbbq"
version = "0.0.12"
description = "Turn video into editable bilingual subtitle drafts and burned output with an AI agent."
readme = "README.md"
authors = [
    { name = "ACAne0320", email = "nyaashino@gmail.com" }
]
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = [
    "ai-agent",
    "bilingual-subtitles",
    "subtitle-translation",
    "video-translation",
    "whisper-cpp",
]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "pydantic>=2.13.4",
    "rich>=15.0.0",
    "typer>=0.26.7",
    "yt-dlp>=2026.6.9",
]

[project.scripts]
openbbq = "openbbq.cli:main"

[project.urls]
Homepage = "https://openbbq.acane.dev"
Repository = "https://github.com/ACAne0320/OpenBBQ"
Issues = "https://github.com/ACAne0320/OpenBBQ/issues"
Documentation = "https://openbbq.acane.dev/en/docs"

[project.optional-dependencies]
whispercpp = [
    "pywhispercpp>=1.5.0",
]
review = [
    "fastapi>=0.128.0",
    "uvicorn>=0.40.0",
]

[build-system]
requires = ["uv_build>=0.11.17,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "fastapi>=0.128.0",
    "httpx>=0.28.0",
    "pytest>=9.1.1",
    "ruff>=0.15.19",
    "ty>=0.0.53",
    "uvicorn>=0.40.0",
]

[tool.ty.src]
include = ["src", "tests"]

[tool.uv.build-backend]
source-include = [
    "README.zh-CN.md",
    "docs/install-agent.md",
    "docs/install-agent.zh-CN.md",
    "docs/release.md",
    "docs/usage.md",
    "docs/usage.zh-CN.md",
    "src/openbbq/review_ui/dist/**",
]
