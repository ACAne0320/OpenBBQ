name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  pypi:
    name: PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Install Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Lint
        run: uv run ruff check

      - name: Type check
        run: uv run ty check

      - name: Test
        run: uv run pytest

      - name: Build
        run: uv build

      - name: Smoke test wheel
        run: uv run --isolated --no-project --with dist/*.whl openbbq --help

      - name: Smoke test source distribution
        run: uv run --isolated --no-project --with dist/*.tar.gz openbbq --help

      - name: Publish to PyPI
        run: uv publish
